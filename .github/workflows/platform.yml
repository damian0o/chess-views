name: platform

on:
  push:
    paths: ['platform/**', '.github/workflows/platform.yml', 'lessons.js', 'positions.json']   # the conversion tests read these POC files
  pull_request:
    paths: ['platform/**', '.github/workflows/platform.yml', 'lessons.js', 'positions.json']   # the conversion tests read these POC files

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run content
