<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Position Viewer</title>
<meta name="description" content="Paste a chess position from lichess and see it in learning views you can copy onto paper.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pieces.css">
<style>
  :root {
    --paper: #ffffff;
    --grid: #dbe5f1;
    --ink: #1d2a44;
    --ink-soft: #5b6880;
    --pencil: #b9c5d8;
    --square-light: #ffffff;
    --square-dark: #c7d2e3;
    --pen-blue: #2456c8;
    --pen-red: #c93b3b;
    --ok: #2f8f5b;
    --focus: #ffb703;
    --cell: clamp(28px, 6vw, 52px);
    font-size: 17px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #161a22; --grid: #232a38; --ink: #e8ecf4; --ink-soft: #9aa6bb; --pencil: #3a4457;
      --square-light: #2a3242; --square-dark: #151a24; --pen-blue: #7ea2ff; --pen-red: #ff7b7b; --ok: #6fcf97;
    }
  }
  :root[data-theme="dark"] {
    --paper: #161a22; --grid: #232a38; --ink: #e8ecf4; --ink-soft: #9aa6bb; --pencil: #3a4457;
    --square-light: #2a3242; --square-dark: #151a24; --pen-blue: #7ea2ff; --pen-red: #ff7b7b; --ok: #6fcf97;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    line-height: 1.45;
    min-height: 100vh;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  .page { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 0 0 20px; color: var(--ink-soft); max-width: 60ch; }

  .loader { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
  textarea {
    width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px;
    font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.85rem;
    color: var(--ink); background: var(--paper); border: 2px solid var(--pencil); border-radius: 6px;
  }
  textarea:focus, button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 6px; cursor: pointer;
    border: 2px solid var(--ink); background: var(--ink); color: var(--paper);
  }
  button.quiet { background: transparent; color: var(--ink); border-color: var(--pencil); font-weight: 400; padding: 6px 12px; }
  button:disabled { opacity: 0.4; cursor: default; }
  .hint { color: var(--ink-soft); font-size: 0.9rem; margin: 6px 0 0; }
  .error { color: var(--pen-red); margin: 6px 0 0; min-height: 1.4em; font-weight: 700; }
  .error:empty { display: none; }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 24px 0 14px; border-bottom: 2px solid var(--pencil); }
  nav.tabs button {
    background: none; border: 0; color: var(--ink-soft); padding: 8px 2px 10px; border-radius: 0; font-weight: 700;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pen-blue); }

  .status { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin: 0 0 12px; }
  .status .turn { font-weight: 700; }
  .status .turn.check { color: var(--pen-red); }
  .nav { display: none; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .nav.on { display: flex; }
  .nav input[type=range] { flex: 1 1 200px; accent-color: var(--pen-blue); }
  .moves { display: flex; flex-wrap: wrap; gap: 2px 6px; margin: 0 0 14px; font-size: 0.9rem; max-height: 6.5em; overflow: auto; }
  .moves .num { color: var(--ink-soft); margin-left: 6px; }
  .moves button { background: none; border: 0; color: var(--ink); padding: 0 3px; font-weight: 400; border-radius: 3px; }
  .moves button.cur { background: var(--pen-blue); color: #fff; }

  main { display: grid; justify-items: center; gap: 14px; }
  .summary { max-width: 70ch; text-align: center; color: var(--ink-soft); margin: 0; white-space: pre-line; }
  .summary strong { color: var(--ink); }
  .legend { font-size: 0.9rem; color: var(--ink-soft); text-align: center; max-width: 60ch; margin: 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  /* Board grid: 10x10 with coordinates around */
  .board { display: grid; grid-template-columns: repeat(10, var(--cell)); grid-auto-rows: var(--cell); gap: 0; user-select: none; }
  .board .coord { display: grid; place-items: center; color: var(--ink-soft); font-size: calc(var(--cell) * 0.36); }
  .board .sq {
    display: grid; place-items: center; position: relative; font-size: calc(var(--cell) * 0.5); line-height: 1;
    border: 1px solid var(--pencil); margin: -0.5px;
  }
  .board .sq.light { background: var(--square-light); }
  .board .sq.dark { background: var(--square-dark); }
  .board .sq .p { display: inline-block; min-width: 1.35em; padding: 0.08em 0.18em; border-radius: 0.25em; text-align: center; font-weight: 600; }
  .board .sq .p.w { background: #fff; color: #111; box-shadow: inset 0 0 0 1.5px #111; }
  .board .sq .p.b { background: #111; color: #fff; }
  .board .sq .dot { color: var(--ink-soft); opacity: 0.8; }
  .board .sq .piece { width: 88%; height: 88%; }
  .board .sq .piece.ghost { position: absolute; left: 1px; top: 1px; width: 38%; height: 38%; opacity: 0.85; }
  .board .sq .reach { position: relative; }
  .board .sq .reach .piece { position: absolute; left: 1px; top: 1px; width: 62%; height: 62%; }
  .board .sq .reach .badge { position: absolute; right: 1px; bottom: 1px; min-width: 1.45em; text-align: center; font-size: 1.1em; font-weight: 700; line-height: 1.35; padding: 0 2px; border-radius: 4px; background: rgba(255,255,255,0.92); color: inherit; box-shadow: 0 0 0 1px rgba(0,0,0,0.15); }
  .board .sq .reach.low .badge { background: var(--pen-red); color: #fff; }
  .board .sq .reach.frozen .badge { background: #e07a10; color: #fff; }
  .dcell .piece { width: 62%; height: 62%; position: relative; z-index: 1; }
  .board .sq .sub { position: absolute; right: 2px; bottom: 1px; font-size: 0.42em; color: var(--ink-soft); }
  .board.plain .sq .p.w, .board.plain .sq .p.b { background: none; color: var(--ink); box-shadow: none; }

  /* Territory */
  .board .sq .mark { font-weight: 700; font-size: 1.1em; }
  .board .sq .ghost { position: absolute; left: 3px; top: 1px; font-size: 0.42em; color: var(--ink-soft); opacity: 0.9; }
  .board .sq.t-w1 { background: #dce8ff; } .board .sq.t-w2 { background: #b9d0ff; } .board .sq.t-w3 { background: #8fb3ff; }
  .board .sq.t-b1 { background: #ffdede; } .board .sq.t-b2 { background: #ffbcbc; } .board .sq.t-b3 { background: #ff9494; }
  .board .sq.t-eq { background: #d9d9d9; }
  .board .sq.t-w1 .mark, .board .sq.t-w2 .mark, .board .sq.t-w3 .mark { color: #1b3f9e; }
  .board .sq.t-b1 .mark, .board .sq.t-b2 .mark, .board .sq.t-b3 .mark { color: #9e1b1b; }
  .board .sq.t-eq .mark { color: #333; }
  /* Reach */
  .board .sq .reach { display: grid; place-items: center; width: 92%; height: 92%; border-radius: 0.2em; font-size: 0.55em; line-height: 1.05; font-weight: 600; text-align: center; }
  .board .sq .reach b { font-size: 1.5em; }
  .board .sq .reach.low { background: #ffd6d6; color: #7a1414; } .board .sq .reach.mid { background: #f1e9c6; color: #5c4a05; } .board .sq .reach.high { background: #cdebd7; color: #0f5a2b; }
  .board .sq .reach.b { outline: 2px solid #111; outline-offset: -2px; }

  /* Roads */
  .roadwrap { position: relative; display: inline-block; }
  .roadwrap > svg { position: absolute; left: var(--cell); top: var(--cell); width: calc(var(--cell) * 8); height: calc(var(--cell) * 8); pointer-events: none; }
  .roadwrap .board .sq { background: transparent !important; }
  .roadwrap .board .sq.dark { background: color-mix(in srgb, var(--square-dark) 45%, transparent) !important; }
  .roadwrap .board .sq.frozen { background-image: repeating-linear-gradient(-45deg, transparent 0 5px, rgba(224,122,16,0.35) 5px 8px) !important; }
  .roadwrap .board .sq .p { position: relative; z-index: 1; }
  .roadwrap .board .sq .dot { display: none; }
  .roadwrap .board .sq.active .p { }
  .roadwrap line { stroke: var(--ink); stroke-linecap: round; opacity: 0.2; }
  .roadwrap line.open { stroke-width: 0.16; }
  .roadwrap line.half { stroke-width: 0.07; }
  .roadwrap line.closed { stroke-width: 0.06; stroke-dasharray: 0.14 0.12; }
  .roadwrap line.used-w { stroke: var(--side-w); opacity: 0.8; }
  .roadwrap line.used-b { stroke: var(--side-b); opacity: 0.8; }
  .roadwrap line.used-both { stroke: #7a3fb0; opacity: 0.85; }
  .roadwrap line.dim { opacity: 0.06; }
  .roadwrap line.pawn { stroke-width: 0.1; opacity: 0.85; stroke-linecap: butt; }
  .roadwrap line.pawn.by-w { stroke: var(--side-w); } .roadwrap line.pawn.by-b { stroke: var(--side-b); }
  .roadwrap line.pawn.guarded { stroke-dasharray: 0.18 0.14; opacity: 0.5; stroke-width: 0.06; }
  .roadwrap line.pawn.stop { stroke-width: 0.12; opacity: 0.9; }
  .roadwrap .board .sq.passed::after { content: '★'; position: absolute; right: 2px; top: 0; font-size: 0.45em; color: #d58a1f; z-index: 3; text-shadow: 0 0 2px #fff; }
  .sw .star { color: #d58a1f; font-size: 16px; }
  .roadwrap line.focus { opacity: 0.95; }
  .roadwrap .board .sq.slider { cursor: pointer; }
  .roadwrap .board .sq.focused .piece, .roadwrap .board .sq.focused .p { box-shadow: 0 0 0 3px var(--focus); border-radius: 50%; }
  .sw.road-w svg line { stroke: var(--side-w) !important; opacity: 0.8 !important; } .sw.road-b svg line { stroke: var(--side-b) !important; opacity: 0.8 !important; } .sw.road-both svg line { stroke: #7a3fb0 !important; opacity: 0.85 !important; }
  .sw.road-dashed svg line { stroke-dasharray: 5 4; }
  /* King houses */
  .board .sq.out { opacity: 0.45; }
  .board .sq.out .dot { display: none; }
  .board .sq .ad { position: absolute; left: 3px; bottom: 2px; font-size: 0.42em; font-weight: 700; color: var(--ink); z-index: 1; background: rgba(255,255,255,0.7); padding: 0 2px; border-radius: 2px; }
  .board .sq.house { outline: 2px solid var(--ink); outline-offset: -2px; z-index: 1; }
  .board .sq.h-p2 { background: #7fd49a; } .board .sq.h-p1 { background: #c6ecd0; } .board .sq.h-0 { background: #fbe9a0; }
  .board .sq.h-m1 { background: #f8b76b; } .board .sq.h-m2 { background: #f26d6d; }
  .board .sq.shield { box-shadow: inset 0 0 0 3px #1e8f4a; }
  .board .sq.shield-missing { box-shadow: inset 0 0 0 3px transparent; background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(201,59,59,0.25) 6px 9px); }
  .board .sq.openfile::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--pen-red); z-index: 1; }
  :root { --side-w: #2456c8; --side-b: #c93b3b; }
  .board .sq.aim .piece, .board .sq.aim .p, .board .sq.defend .piece, .board .sq.defend .p { border-radius: 50%; }
  .board .sq.aim.side-w .piece, .board .sq.aim.side-w .p { box-shadow: 0 0 0 3px var(--side-w); }
  .board .sq.aim.side-b .piece, .board .sq.aim.side-b .p { box-shadow: 0 0 0 3px var(--side-b); }
  .board .sq.defend.side-w .piece, .board .sq.defend.side-w .p { outline: 3px dashed var(--side-w); outline-offset: 1px; }
  .board .sq.defend.side-b .piece, .board .sq.defend.side-b .p { outline: 3px dashed var(--side-b); outline-offset: 1px; }
  .board .sq.aim.defend .piece, .board .sq.aim.defend .p { outline-offset: 4px; }
  .presswrap { position: relative; display: inline-block; }
  .presswrap > svg { position: absolute; left: var(--cell); top: var(--cell); width: calc(var(--cell) * 8); height: calc(var(--cell) * 8); pointer-events: none; z-index: 5; }
  .presswrap line { stroke: var(--side-b); stroke-width: 0.09; stroke-linecap: round; opacity: 0.85; }
  .presswrap line.by-w { stroke: var(--side-w); }
  .presswrap line.pin { stroke: #e07a10; stroke-width: 0.07; opacity: 0.9; }
  .presswrap line.pin.relative { stroke-dasharray: 0.2 0.12; opacity: 0.75; }
  .board .sq.pinned .piece, .board .sq.pinned .p { box-shadow: 0 0 0 3px #e07a10; border-radius: 50%; }
  .lock { position: absolute; right: 2px; top: 2px; width: 34%; height: 34%; z-index: 3; }
  .lock svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 1px #fff); }
  .board .sq.frozen { background-image: repeating-linear-gradient(-45deg, transparent 0 5px, rgba(224,122,16,0.28) 5px 8px); }
  .board .sq.frozen .piece { opacity: 0.75; }
  .board .sq .reach.frozen { background: #f8d9b5; color: #7a3a00; }
  .roadwrap line.frozen { stroke-dasharray: 0.16 0.14; opacity: 0.35; }
  .sw .lock { position: static; width: 18px; height: 18px; }
  .presswrap line.defend { stroke-width: 0.05; opacity: 0.6; stroke-dasharray: 0.18 0.14; }
  .houses { display: grid; gap: 12px 28px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); max-width: 72ch; width: 100%; }
  .houses h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .houses .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.85rem; margin-left: 8px; color: #fff; }
  .board .sq.escape::after { content: ''; position: absolute; width: 38%; height: 38%; border: 3px dashed #1e8f4a; border-radius: 50%; left: 31%; top: 31%; z-index: 1; }
  .houses .tag.Safe { background: #4b7bd6; }
  .houses .tag.Strong { background: #1e8f4a; } .houses .tag.Shaky { background: #d58a1f; } .houses .tag.danger { background: var(--pen-red); }
  .houses ul { margin: 0; padding-left: 1.1em; }
  .houses li { margin: 2px 0; }
  .houses .score { color: var(--ink-soft); font-size: 0.85rem; margin: 4px 0 0; }
  .twocol { display: grid; gap: 4px 24px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); max-width: 70ch; }
  .twocol p { margin: 0; }

  /* Diamond */
  .diamond { --d: clamp(34px, 6.4vw, 60px); position: relative; padding: calc(var(--d) * 0.3) 0; user-select: none; }
  .diamond::before, .diamond::after { content: ''; position: absolute; background: var(--pen-blue); opacity: 0.35; pointer-events: none; }
  .diamond::before { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-1px); }
  .diamond::after { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-1px); }
  .diamond .row { display: flex; justify-content: center; height: var(--d); }
  .diamond .row + .row { margin-top: calc(var(--d) * -0.5); }
  .dcell { width: var(--d); height: var(--d); position: relative; display: grid; place-items: center; font-size: calc(var(--d) * 0.33); }
  .dcell .shape { position: absolute; inset: 14.6%; transform: rotate(45deg); border: 1px solid var(--pencil); }
  .dcell.light .shape { background: var(--square-light); } .dcell.dark .shape { background: var(--square-dark); }
  .dcell .p, .dcell .dot { position: relative; z-index: 1; }
  .dcell .p { display: inline-block; min-width: 1.3em; padding: 0.05em 0.15em; border-radius: 0.25em; text-align: center; font-weight: 600; line-height: 1; }
  .dcell .p.w { background: #fff; color: #111; box-shadow: inset 0 0 0 1.5px #111; }
  .dcell .p.b { background: #111; color: #fff; }
  .dcell .dot { color: var(--ink-soft); }
  .dcell .co { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.55em; color: var(--ink-soft); z-index: 1; line-height: 1; }
  .dcell.light .co { color: var(--ink-soft); }
  .diamond .lbl { position: absolute; font-size: 0.8rem; color: var(--pen-blue); }
  .diamond .lbl.top { top: 0; left: 50%; transform: translate(-50%, -100%); }
  .diamond .lbl.left { left: 0; top: 50%; transform: translate(-100%, -50%) rotate(-90deg); transform-origin: center; }

  /* Print sheet */
  #print-sheet { display: none; }
  @media print {
    @page { margin: 12mm; }
    body { background: #fff; color: #000; font-size: 11pt; min-height: 0; }
    .page { padding: 0; max-width: none; }
    .page > *:not(#print-sheet) { display: none !important; }
    #print-sheet { display: block; }
    #print-sheet h2 { font-size: 13pt; margin: 0 0 2mm; }
    #print-sheet .board { --cell: 10.5mm; margin: 0 auto; }
    #print-sheet .board .sq { border: 0.4pt solid #000; margin: 0; color: #000; }
    #print-sheet .board .sq.light { background: #fff; }
    #print-sheet .board .sq.dark { background: #e6e6e6; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #print-sheet .board .sq .p { background: none; color: #000; box-shadow: none; font-weight: 600; }
    #print-sheet .board .sq .dot { color: #000; opacity: 1; }
    #print-sheet .board .coord { color: #000; }
    #print-sheet .blank .sq { background: #fff !important; }
    #print-sheet .blank .sq.dark .dot { color: #999; }
    #print-sheet .summary, #print-sheet .legend { color: #000; max-width: none; margin: 2mm auto 0; text-align: center; font-size: 10pt; }
    #print-sheet .fen { font-size: 8pt; text-align: center; margin: 1mm 0 3mm; word-break: break-all; color: #333; }
    #print-sheet .copy { margin: 3mm 0 2mm; text-align: center; font-size: 10pt; color: #000; }
  }

  /* Knight */
  .knightwrap { position: relative; display: inline-block; }
  .knightwrap > svg { position: absolute; left: var(--cell); top: var(--cell); width: calc(var(--cell) * 8); height: calc(var(--cell) * 8); pointer-events: none; z-index: 5; }
  .knightwrap line { stroke: var(--pen-blue); stroke-width: 0.06; opacity: 0.6; stroke-linecap: round; }
  .knightwrap .board .sq { cursor: pointer; }
  .knightwrap .board .sq .dot { display: none; }
  .knightwrap .board .sq.origin { outline: 3px solid var(--pen-blue); outline-offset: -3px; z-index: 1; }
  .knightwrap .board .sq .hop { display: grid; place-items: center; width: 1.4em; height: 1.4em; border-radius: 50%; font-weight: 700; font-size: 0.6em; background: var(--pen-blue); color: #fff; position: relative; z-index: 1; }
  .knightwrap .board .sq .hop.own { background: #999; color: #fff; text-decoration: line-through; }
  .knightwrap .board .sq .hop.enemy { background: var(--pen-red); }
  .knightwrap .board .sq .hop.far { opacity: 0.55; }
  .knightwrap .board .sq .dist { font-weight: 700; font-size: 0.55em; color: var(--ink); position: relative; z-index: 1; }
  .knightwrap .board .sq.d1 { background: #d9e6ff; } .knightwrap .board .sq.d2 { background: #e6efff; } .knightwrap .board .sq.d3 { background: #f6f1dc; }
  .knightwrap .board .sq.d4 { background: #f3e2c2; } .knightwrap .board .sq.d5 { background: #f0cfa9; } .knightwrap .board .sq.d6 { background: #e9b98f; }
  .knightwrap .board .sq .imaginary { opacity: 0.55; }
  .toggle { display: flex; gap: 8px; align-items: center; color: var(--ink-soft); font-size: 0.95rem; }

  /* Visual legend */
  .vlegend { list-style: none; margin: 4px 0 0; padding: 10px 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 18px; max-width: 760px; width: 100%; font-size: 0.9rem; color: var(--ink-soft); border: 1px solid var(--pencil); border-radius: 8px; background: color-mix(in srgb, var(--paper) 85%, transparent); }
  .vlegend li { display: flex; align-items: center; gap: 10px; min-height: 26px; }
  .sw { flex: 0 0 auto; width: 26px; height: 26px; display: grid; place-items: center; position: relative; border: 1px solid var(--pencil); background: var(--square-light); font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .sw svg { width: 100%; height: 100%; overflow: visible; }
  .sw.wide { width: 44px; }
  .sw.none { border: 0; background: none; }
  .sw.h-p2 { background: #7fd49a; } .sw.h-p1 { background: #c6ecd0; } .sw.h-0 { background: #fbe9a0; } .sw.h-m1 { background: #f8b76b; } .sw.h-m2 { background: #f26d6d; }
  .sw.shield { box-shadow: inset 0 0 0 3px #1e8f4a; }
  .sw.shield-missing { background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(201,59,59,0.3) 4px 6px); }
  .sw.openfile::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--pen-red); }
  .sw.escape::after { content: ''; position: absolute; width: 40%; height: 40%; border: 2px dashed #1e8f4a; border-radius: 50%; left: 30%; top: 30%; }
  .sw .ring { width: 14px; height: 14px; border-radius: 50%; background: var(--paper); }
  .sw .ring.aim-w { box-shadow: 0 0 0 3px var(--side-w); } .sw .ring.aim-b { box-shadow: 0 0 0 3px var(--side-b); }
  .sw .ring.def-w { outline: 3px dashed var(--side-w); outline-offset: 1px; } .sw .ring.def-b { outline: 3px dashed var(--side-b); outline-offset: 1px; }
  .sw .ring.green { box-shadow: 0 0 0 3px #1e8f4a; }
  .sw .pinbadge { font-size: 9px; font-weight: 700; color: #fff; background: #e07a10; padding: 0 3px; border-radius: 3px; }
  .sw .num { font-size: 10px; font-weight: 700; color: var(--ink); }
  .sw .mark { font-weight: 700; font-size: 16px; }
  .sw.t-w { background: #b9d0ff; } .sw.t-w .mark { color: #1b3f9e; } .sw.t-b { background: #ffbcbc; } .sw.t-b .mark { color: #9e1b1b; } .sw.t-eq { background: #d9d9d9; }
  .sw.low { background: #ffd6d6; } .sw.mid { background: #f1e9c6; } .sw.high { background: #cdebd7; }
  .sw .hop { width: 16px; height: 16px; border-radius: 50%; background: var(--pen-blue); color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; }
  .sw .hop.own { background: #999; text-decoration: line-through; } .sw .hop.enemy { background: var(--pen-red); }

  /* Right-click move preview */
  .board .sq.mv-from { outline: 3px solid var(--focus); outline-offset: -3px; z-index: 2; }
  .board .sq .mv { position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(36, 86, 200, 0.55); z-index: 4; pointer-events: none; }
  .board .sq .mv.capture { width: 86%; height: 86%; background: none; border: 4px solid rgba(201, 59, 59, 0.75); box-sizing: border-box; }
  .board .sq .mv.illegal { background: rgba(120, 120, 120, 0.45); }
  .mvhint { font-size: 0.85rem; color: var(--ink-soft); margin: 0; }

  footer { margin-top: 48px; font-size: 0.85rem; color: var(--ink-soft); }
  @media (max-width: 600px) { .loader { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Position viewer</h1>
    <p>Paste a position from lichess and look at it in different ways. Switch to letters when you want to copy a position onto squared paper.</p>
  </header>

  <section class="loader" aria-label="Load a position">
    <div>
      <label for="input" class="hint" style="margin:0 0 4px;display:block">FEN, PGN, or a lichess link</label>
      <textarea id="input" spellcheck="false" placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"></textarea>
      <p id="error" class="error" role="alert"></p>
    </div>
    <button id="load" type="button" style="margin-top:26px">Load</button>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>

  <div class="status">
    <span id="turn" class="turn"></span>
    <span id="fen" class="mono hint" style="margin:0;font-size:0.75rem;word-break:break-all"></span>
    <span style="margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <label class="hint" style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="letters"> Letters for paper</label>
      <button class="quiet" id="flip" type="button" title="Turn the board around (f)">Flip board</button>
    </span>
  </div>
  <div class="nav" id="nav">
    <button class="quiet" id="first" title="Start">⏮</button>
    <button class="quiet" id="prev" title="Back one move">◀</button>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Move">
    <button class="quiet" id="next" title="Forward one move">▶</button>
    <button class="quiet" id="last" title="End">⏭</button>
    <span id="plyLabel" class="hint" style="margin:0"></span>
  </div>
  <div class="moves" id="moves"></div>

  <main id="view" aria-live="polite"></main>

  <section id="print-sheet" aria-hidden="true"></section>

  <footer>Paper rule: capitals are pieces, <span class="mono">'</span> means black, <span class="mono">o</span> is a white pawn, <span class="mono">x</span> a black pawn. a1 is dark. Piece images by Colin M.L. Burnett (CC BY-SA 3.0).</footer>
</div>

<script type="module">
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/esm/chess.js';
import * as A from './analysis.js';

const $ = (id) => document.getElementById(id);
const LEGEND = "Capitals are pieces. ' means black. o white pawn, x black pawn. a1 is dark.";
const NAMES = { k: 'K', q: 'Q', r: 'R', b: 'B', n: 'N', p: 'P' };

// ---------- state ----------
const state = { chess: new Chess(), moves: [], ply: 0, source: { kind: 'fen', fen: A.START_FEN }, tab: 'board', pieceStyle: 'images', knightSquare: null, knightDistances: false, roadFocus: null, flipped: false, showMoves: null, allPawnPaths: false };
try { if (localStorage.getItem('pieceStyle') === 'letters') state.pieceStyle = 'letters'; } catch {}

function currentChess() {
  if (!state.moves.length) return state.chess;
  const c = new Chess(); c.load(state.startFen, { skipValidation: true });
  for (const m of state.moves.slice(0, state.ply)) c.move(m.san);
  return c;
}

function setPosition(source) {
  state.knightSquare = null;
  state.showMoves = null;
  state.roadFocus = null;
  const chess = new Chess();
  if (source.kind === 'fen') {
    chess.load(source.fen, { skipValidation: true });
    Object.assign(state, { chess, moves: [], ply: 0, startFen: source.fen, source });
  } else {
    chess.loadPgn(source.pgn);
    const moves = chess.history({ verbose: true });
    const startFen = chess.getHeaders()['FEN'] || A.START_FEN;
    const wanted = Number.isFinite(source.ply) ? source.ply : moves.length;
    const ply = Math.max(0, Math.min(moves.length, wanted));
    Object.assign(state, { chess, moves, ply, startFen, source });
  }
}

// ---------- hash sync ----------
function writeHash() {
  const p = new URLSearchParams();
  if (state.source.kind === 'fen') p.set('fen', state.source.fen);
  else { p.set('pgn', state.source.pgn); p.set('ply', String(state.ply)); }
  if (state.tab !== 'board') p.set('view', state.tab);
  if (state.flipped) p.set('flip', '1');
  history.replaceState(null, '', '#' + p.toString());
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('view') && VIEWS[p.get('view')]) state.tab = p.get('view');
  state.flipped = p.get('flip') === '1';
  if (p.get('fen')) {
    const parsed = A.parseInput(p.get('fen'));
    if (parsed.kind !== 'fen') throw new Error(parsed.reason || 'bad fen in link');
    return parsed;
  }
  if (p.get('pgn')) return { kind: 'pgn', pgn: p.get('pgn'), ply: p.has('ply') ? Number(p.get('ply')) : undefined };
  return null;
}

// ---------- loading ----------
async function load(text) {
  const parsed = A.parseInput(text);
  $('error').textContent = '';
  try {
    if (parsed.kind === 'unknown') throw new Error('Could not read that as FEN, PGN or lichess link.');
    if (parsed.kind === 'invalid') throw new Error(`Could not read that FEN. ${parsed.reason}`);
    if (parsed.kind === 'lichess-game') {
      $('error').textContent = '';
      $('load').disabled = true;
      let pgn;
      try {
        const res = await fetch(`https://lichess.org/game/export/${parsed.gameId}?clocks=false&evals=false`, { headers: { Accept: 'application/x-chess-pgn' } });
        if (!res.ok) throw new Error(String(res.status));
        pgn = await res.text();
      } catch {
        throw new Error('Could not fetch that game from lichess; paste the PGN instead.');
      } finally { $('load').disabled = false; }
      setPosition({ kind: 'pgn', pgn, ply: parsed.ply });
    } else {
      setPosition(parsed);
    }
  } catch (e) {
    $('error').textContent = e.message.startsWith('Could not') ? e.message : `Could not load that position: ${e.message}`;
    return;
  }
  writeHash();
  render();
}

// ---------- rendering helpers ----------
function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of children) n.append(c);
  return n;
}

/** Legal moves for the piece on `square`, even when it is not that side's turn (turn is swapped for the lookup). */
function legalMovesFor(chess, square) {
  const piece = chess.get(square);
  if (!piece) return [];
  if (piece.color === chess.turn()) return chess.moves({ square, verbose: true });
  const f = chess.fen().split(' ');
  f[1] = piece.color; f[3] = '-';
  const alt = new Chess();
  try { alt.load(f.join(' '), { skipValidation: true }); return alt.moves({ square, verbose: true }); } catch { return []; }
}

/** Centre of a square in the 8x8 overlay coordinate space, honouring the flip. */
function cellXY(sq) {
  const { row, col } = A.squareIndex(sq);
  return state.flipped ? [7 - col + 0.5, 7 - row + 0.5] : [col + 0.5, row + 0.5];
}

/** Build a 10x10 board grid. cellFn(row, col, cell, name) returns a node (or nodes) for the square. */
function boardGrid(board, cellFn, extraClass = '') {
  const g = el('div', { class: `board mono ${extraClass}`.trim(), role: 'img' });
  const files = state.flipped ? 'hgfedcba' : 'abcdefgh';
  const order = state.flipped ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
  const coordRow = () => { g.append(el('div', { class: 'coord' })); for (const f of files) g.append(el('div', { class: 'coord', text: f })); g.append(el('div', { class: 'coord' })); };
  coordRow();
  for (const row of order) {
    g.append(el('div', { class: 'coord', text: String(8 - row) }));
    for (const col of order) {
      const name = A.squareName(row, col);
      const sq = el('div', { class: `sq ${A.squareColor(name)}`, title: name, 'data-square': name });
      const content = cellFn(row, col, board[row][col], name);
      if (content) sq.append(...[].concat(content));
      sq.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        state.showMoves = board[row][col] && state.showMoves !== name ? name : null;
        render();
      });
      g.append(sq);
    }
    g.append(el('div', { class: 'coord', text: String(8 - row) }));
  }
  coordRow();
  if (state.showMoves) {
    const chess = currentChess();
    const moves = legalMovesFor(chess, state.showMoves);
    const from = g.querySelector(`[data-square="${state.showMoves}"]`);
    if (from) from.classList.add('mv-from');
    for (const m of moves) {
      const cell = g.querySelector(`[data-square="${m.to}"]`);
      if (cell) cell.append(el('span', { class: `mv ${m.captured ? 'capture' : ''}`.trim() }));
    }
    g.dataset.moves = String(moves.length);
  }
  return g;
}

const PIECE_WORDS = { k: 'king', q: 'queen', r: 'rook', b: 'bishop', n: 'knight', p: 'pawn' };
function pieceImage(cell, extra = '') {
  const label = `${cell.color === 'w' ? 'white' : 'black'} ${PIECE_WORDS[cell.type]}`;
  return el('span', { class: `piece ${cell.color}${cell.type.toUpperCase()} ${extra}`.trim(), role: 'img', 'aria-label': label, title: label });
}
function pieceNode(cell, name, style = state.pieceStyle) {
  if (!cell) return A.squareColor(name) === 'dark' ? el('span', { class: 'dot', text: '.' }) : null;
  if (style === 'images') return pieceImage(cell);
  return el('span', { class: `p ${cell.color}`, text: A.symbol(cell, name) });
}
/** Small marker in a cell corner so a map can still show where the pieces are. */
function ghostNode(cell, name) {
  return state.pieceStyle === 'images' ? pieceImage(cell, 'ghost') : el('span', { class: 'ghost', text: A.symbol(cell, name) });
}

function pieceList(board) {
  const words = { w: [], b: [] };
  const order = { k: 0, q: 1, r: 2, b: 3, n: 4, p: 5 };
  const all = board.flat().filter(Boolean).sort((x, y) => order[x.type] - order[y.type]);
  for (const p of all) {
    if (p.type === 'p') continue;
    words[p.color].push(p.type === 'b' ? `B(${A.squareColor(p.square)})` : NAMES[p.type]);
  }
  for (const c of ['w', 'b']) {
    const pawns = all.filter((p) => p.color === c && p.type === 'p').length;
    if (pawns) words[c].push(`${pawns} pawn${pawns === 1 ? '' : 's'}`);
  }
  return `White: ${words.w.join(' ') || 'nothing'}\nBlack: ${words.b.join(' ') || 'nothing'}`;
}

// ---------- views ----------
const VIEWS = {
  board: {
    title: 'Board',
    render(container, board) {
      container.append(boardGrid(board, (r, c, cell, name) => pieceNode(cell, name)));
      container.append(el('p', { class: 'summary mono', text: pieceList(board) }));
      if (state.pieceStyle === 'letters') container.append(el('p', { class: 'legend', text: LEGEND }));
      container.append(el('div', { class: 'actions' }, [
        el('button', { class: 'quiet', type: 'button', text: 'Copy as text', onclick: async (e) => {
          await navigator.clipboard.writeText(A.boardText(board));
          e.target.textContent = 'Copied'; setTimeout(() => { e.target.textContent = 'Copy as text'; }, 1200);
        } }),
        el('button', { class: 'quiet', type: 'button', text: 'Print', onclick: () => { buildPrintSheet(board); window.print(); } }),
      ]));
    },
  },
  territory: {
    title: 'Territory',
    render(container, board) {
      const t = A.territory(board);
      const pinnedSquares = new Set(t.pinned.map((p) => p.square));
      const tgrid = tintTerritory(boardGrid(board, (r, c, cell, name) => {
        const nodes = [];
        if (cell) nodes.push(ghostNode(cell, name));
        const m = t.mark[r][c];
        if (m) nodes.push(el('span', { class: 'mark', text: m }));
        if (pinnedSquares.has(name)) nodes.push(lockNode('absolute'));
        return nodes;
      }), t);
      for (const sq of tgrid.querySelectorAll('.sq')) if (pinnedSquares.has(sq.dataset.square)) sq.classList.add('frozen');
      container.append(tgrid);
      const s = t.summary;
      container.append(el('p', { class: 'summary' }, [
        el('strong', { text: `White controls ${s.w} squares` }), ` (centre: ${s.centerW}), `,
        el('strong', { text: `Black controls ${s.b}` }), ` (centre: ${s.centerB}).`,
      ]));
      container.append(legend([
        { sw: 'mark', cls: 't-w', text2: '+', text: 'White attacks it more (darker = bigger lead)' },
        { sw: 'mark', cls: 't-b', text2: '-', text: 'Black attacks it more' },
        { sw: 'mark', cls: 't-eq', text2: '=', text: 'both attack it the same' },
        { sw: 'sq', text: 'nobody attacks it' },
        { sw: 'lock', kind: 'absolute', text: 'pinned to its king: only counts along the pin line' },
      ]));
    },
  },
  reach: {
    title: 'Reach',
    render(container, board) {
      const m = A.mobility(board, { respectPins: true });
      const byValue = Object.fromEntries(m.pieces.map((p) => [p.square, p.count]));
      const pinnedAs = Object.fromEntries(m.pieces.filter((p) => p.pinned).map((p) => [p.square, p.pinned]));
      container.append(boardGrid(board, (r, c, cell, name) => {
        if (!cell) return pieceNode(cell, name);
        const n = byValue[name];
        const kids = state.pieceStyle === 'images'
          ? [pieceImage(cell), el('b', { class: 'badge', text: String(n) })]
          : [document.createTextNode(A.symbol(cell, name)), el('br'), el('b', { text: String(n) })];
        const pin = pinnedAs[name];
        const node = el('span', { class: `reach ${A.mobilityTone(n)} ${cell.color} ${pin === 'absolute' ? 'frozen' : ''}`.trim() }, kids);
        if (pin) node.append(lockNode(pin));
        return node;
      }));
      container.append(el('p', { class: 'summary' }, [
        'Mobility: ', el('strong', { text: `White ${m.summary.w}` }), ', ', el('strong', { text: `Black ${m.summary.b}` }), '.',
      ]));
      container.append(legend([
        { sw: 'num', cls: 'low', text2: '0–2', text: 'stuck: almost nowhere to go' },
        { sw: 'num', cls: 'mid', text2: '3–6', text: 'some room' },
        { sw: 'num', cls: 'high', text2: '7+', text: 'free: many squares to go to' },
        { sw: 'lock', kind: 'absolute', text: 'pinned to the king: only moves along the pin line count' },
        { sw: 'lock', kind: 'relative', text: 'pinned to a bigger piece: can move, but it costs' },
      ]));
    },
  },
  roads: {
    title: 'Roads',
    render(container, board) {
      const list = A.roads(board);
      const usersOf = (road) => road.pieces.filter((p) => (road.kind === 'diag' ? 'bq' : 'rq').includes(p.type));
      const sideOf = (users) => { const w = users.some((p) => p.color === 'w'), b = users.some((p) => p.color === 'b'); return w && b ? 'both' : w ? 'w' : b ? 'b' : 'none'; };
      const focus = state.roadFocus && board.flat().find((p) => p && p.square === state.roadFocus && 'rbqp'.includes(p.type)) ? state.roadFocus : null;
      const paths = A.pawnPaths(board);
      const focusPawn = focus ? paths.find((x) => x.square === focus) : null;
      if (!focus) state.roadFocus = null;

      const frozen = new Map();
      for (const pn of A.pins(board)) if (pn.absolute && 'rbq'.includes(pn.pinned.type)) frozen.set(pn.pinned.square, pn);
      const grid = boardGrid(board, (r, c, cell, name) => pieceNode(cell, name));
      for (const sq of grid.querySelectorAll('.sq')) {
        const name = sq.dataset.square;
        const { row, col } = A.squareIndex(name);
        const p = board[row][col];
        if (p && 'rbqp'.includes(p.type)) sq.classList.add('slider');
        if (frozen.has(name)) { sq.classList.add('frozen'); sq.append(lockNode('absolute')); }
        const pp = paths.find((x) => x.square === name);
        if (pp && pp.passed) sq.classList.add('passed');
        if (name === focus) sq.classList.add('focused');
        sq.addEventListener('click', () => {
          state.roadFocus = p && 'rbqp'.includes(p.type) && state.roadFocus !== name ? name : null;
          render();
        });
      }

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 8 8');
      svg.setAttribute('aria-hidden', 'true');
      const centre = cellXY;
      // Without focus: blocked roads are hidden, half-open diagonals only when long, ranks only when a rook/queen uses them.
      const anySlider = board.flat().some((p) => p && 'rbq'.includes(p.type));
      const worthDrawing = (road, users) => {
        if (focusPawn) return false;
        if (!users.length && !anySlider) return false; // nobody on the board could use it
        if (focus) return road.squares.includes(focus) && users.some((p) => p.square === focus);
        if (road.state === 'closed') return false;
        if (road.kind === 'rank') return road.state === 'open' && users.length > 0;
        if (road.kind === 'diag' && road.state === 'half') return road.squares.length >= 5 || users.length > 0;
        return true;
      };
      const order = { closed: 0, half: 1, open: 2 };
      const drawn = list.map((road) => ({ road, users: usersOf(road) })).filter(({ road, users }) => worthDrawing(road, users));
      drawn.sort((a, b) => (order[a.road.state] - order[b.road.state]) || ((a.users.length ? 1 : 0) - (b.users.length ? 1 : 0)));
      for (const { road, users } of drawn) {
        const [x1, y1] = centre(road.squares[0]);
        const [x2, y2] = centre(road.squares[road.squares.length - 1]);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        const side = sideOf(users);
        // A road only a pinned piece stands on is a road it cannot use (unless it is the pin line itself).
        const usable = users.filter((u) => !frozen.has(u.square) || frozen.get(u.square).between.concat([frozen.get(u.square).pinner.square, frozen.get(u.square).target.square]).every((sq) => road.squares.includes(sq)));
        const cls = [road.state, side !== 'none' ? `used-${side}` : '', focus ? 'focus' : '', users.length && !usable.length ? 'frozen' : ''].filter(Boolean).join(' ');
        for (const [k, v] of Object.entries({ x1, y1, x2, y2, class: cls })) line.setAttribute(k, v);
        line.append(Object.assign(document.createElementNS('http://www.w3.org/2000/svg', 'title'), { textContent: `${road.kind} ${road.id}: ${road.state}${users.length ? ', used by ' + users.map((p) => p.square).join(' ') : ''}` }));
        svg.append(line);
      }
      // Pawn paths: passed pawns always (or every pawn with the toggle); a focused pawn alone.
      const pawnLine = (pp, cls) => {
        if (!pp.path.length) return;
        const stopAt = pp.blocker ? pp.path[pp.path.indexOf(pp.blocker)] : pp.path[pp.path.length - 1];
        const [x1, y0] = centre(pp.square), [x2, y2] = centre(stopAt);
        const y1 = y0 + Math.sign(y2 - y0) * 0.42; // start at the pawn's edge, not under it
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        for (const [k, v] of Object.entries({ x1, y1, x2, y2, class: `pawn by-${pp.color} ${cls}`.trim() })) line.setAttribute(k, v);
        line.append(Object.assign(document.createElementNS('http://www.w3.org/2000/svg', 'title'), { textContent: `${pp.square}: ${pp.passed ? 'passed pawn' : 'can be stopped by ' + pp.guards.join(', ')}${pp.blocker ? ', blocked at ' + pp.blocker : ''}` }));
        svg.append(line);
        if (pp.blocker) {
          const bar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          const [bx, by] = centre(pp.blocker);
          const dy = pp.color === 'w' ? 0.5 : -0.5;
          for (const [k, v] of Object.entries({ x1: bx - 0.3, y1: by + (state.flipped ? -dy : dy), x2: bx + 0.3, y2: by + (state.flipped ? -dy : dy), class: `pawn by-${pp.color} stop` })) bar.setAttribute(k, v);
          svg.append(bar);
        }
      };
      const shown = focusPawn ? [focusPawn] : paths.filter((pp) => state.allPawnPaths || pp.passed);
      for (const pp of shown) pawnLine(pp, pp.passed ? '' : 'guarded');
      container.append(el('div', { class: 'roadwrap' }, [grid, svg]));

      const open = list.filter((x) => x.state === 'open');

/** Visual legend: [{sw: 'kind', cls?: 'extra classes', text}] → a grid of swatch + words. */
function legend(items) {
  const svgLine = (cls, dashed, arrow) =>
    `<svg viewBox="0 0 44 26"><defs><marker id="lg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c93b3b"/></marker></defs><line x1="4" y1="20" x2="${arrow ? 34 : 40}" y2="6" stroke="${cls}" stroke-width="3" stroke-linecap="round" ${dashed ? 'stroke-dasharray="6 4"' : ''} ${arrow ? 'marker-end="url(#lg-arrow)"' : ''}/></svg>`;
  const ul = el('ul', { class: 'vlegend' });
  for (const it of items) {
    const sw = el('span', { class: `sw ${it.cls || ''}`.trim() });
    switch (it.sw) {
      case 'arrow': sw.classList.add('wide', 'none'); sw.innerHTML = svgLine('#c93b3b', false, true); break;
      case 'pin': sw.classList.add('wide', 'none'); sw.innerHTML = svgLine('#e07a10', false, false); break;
      case 'pin-dashed': sw.classList.add('wide', 'none'); sw.innerHTML = svgLine('#e07a10', true, false); break;
      case 'defend-line': sw.classList.add('wide', 'none'); sw.innerHTML = svgLine(it.color === 'w' ? '#2456c8' : '#c93b3b', true, false); break;
    case 'arrow-w': sw.classList.add('wide', 'none'); sw.innerHTML = svgLine('#2456c8', false, true).replace('fill="#c93b3b"', 'fill="#2456c8"').replace(/lg-arrow/g, 'lg-arrow-w'); break;
      case 'road': sw.classList.add('wide', 'none'); sw.innerHTML = `<svg viewBox="0 0 44 26"><line x1="4" y1="13" x2="40" y2="13" stroke="#1d2a44" stroke-width="${it.width || 5}" stroke-linecap="round" opacity="0.6"/></svg>`; break;
      case 'ring': sw.classList.add('none'); sw.append(el('span', { class: `ring ${it.cls || ''}` })); sw.className = 'sw none'; break;
      case 'pinbadge': sw.classList.add('none'); sw.append(el('span', { class: 'pinbadge', text: 'pin' })); break;
      case 'lock': sw.classList.add('none'); sw.append(lockNode(it.kind)); break;
      case 'star': sw.classList.add('none'); sw.append(el('span', { class: 'star', text: '★' })); break;
      case 'num': sw.append(el('span', { class: 'num', text: it.text2 || '2/1' })); break;
      case 'mark': sw.append(el('span', { class: 'mark', text: it.text2 })); break;
      case 'hop': sw.append(el('span', { class: `hop ${it.cls || ''}`, text: it.text2 || '1' })); sw.className = 'sw'; break;
      case 'piece': sw.classList.add('none'); sw.append(pieceImage({ type: it.type || 'n', color: it.color || 'w' })); sw.querySelector('.piece').style.cssText = 'width:24px;height:24px'; break;
      default: break; // plain square with cls
    }
    ul.append(el('li', {}, [sw, document.createTextNode(it.text)]));
  }
  return ul;
}

function lockNode(kind) {
  const closed = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="2" fill="#e07a10"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#e07a10" stroke-width="2.4"/><circle cx="12" cy="16" r="1.8" fill="#fff"/></svg>';
  const open = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="2" fill="none" stroke="#e07a10" stroke-width="2.2"/><path d="M8 10V7a4 4 0 0 1 8 0" fill="none" stroke="#e07a10" stroke-width="2.4"/><circle cx="12" cy="16" r="1.8" fill="#e07a10"/></svg>';
  const n = el('span', { class: `lock ${kind}`, title: kind === 'absolute' ? 'Pinned to the king: it cannot leave the pin line' : 'Pinned to a bigger piece: moving it costs material' });
  n.innerHTML = kind === 'absolute' ? closed : open;
  return n;
}

function pinWords(list) {
  return list.map((pn) => `${PIECE_WORDS[pn.pinned.type]} on ${pn.pinned.square} is pinned to the ${pn.absolute ? 'king' : PIECE_WORDS[pn.target.type]} by the ${PIECE_WORDS[pn.pinner.type]} on ${pn.pinner.square}`).join('; ');
}

function boardGridClickable(board, cellFn, cls) {
  const grid = boardGrid(board, (r, c, cell, name) => cell ? ghostNode(cell, name) : null);
  for (const sq of grid.querySelectorAll('.sq')) sq.addEventListener('click', () => { state.knightSquare = sq.dataset.square; render(); });
  return el('div', { class: cls }, [grid]);
}

function tintTerritory(grid, t) {
  for (const sq of grid.querySelectorAll('.sq')) {
    const { row, col } = A.squareIndex(sq.dataset.square);
    const d = t.diff[row][col];
    const mark = t.mark[row][col];
    if (mark === '=') sq.classList.add('t-eq');
    else if (d > 0) sq.classList.add(`t-w${Math.min(3, d)}`);
    else if (d < 0) sq.classList.add(`t-b${Math.min(3, -d)}`);
  }
  return grid;
}

function buildPrintSheet(board) {
  const sheet = $('print-sheet');
  sheet.replaceChildren(
    el('h2', { text: 'Position' }),
    boardGrid(board, (r, c, cell, name) => pieceNode(cell, name, 'letters'), 'plain'),
    el('p', { class: 'summary mono', text: pieceList(board) }),
    el('p', { class: 'legend', text: LEGEND }),
    el('p', { class: 'fen mono', text: currentChess().fen() }),
    el('p', { class: 'copy', text: 'Copy the position here:' }),
    boardGrid(board, (r, c, cell, name) => (A.squareColor(name) === 'dark' ? el('span', { class: 'dot', text: '.' }) : null), 'plain blank'),
  );
  return sheet;
}

function renderTabs() {
  const nav = $('tabs');
  nav.replaceChildren();
  for (const [key, v] of Object.entries(VIEWS)) {
    nav.append(el('button', { role: 'tab', 'aria-selected': String(key === state.tab), text: v.title, onclick: () => { state.tab = key; writeHash(); render(); } }));
  }
}

function render() {
  const chess = currentChess();
  const board = chess.board();
  renderTabs();
  $('letters').checked = state.pieceStyle === 'letters';
  $('flip').setAttribute('aria-pressed', String(state.flipped));
  $('flip').textContent = state.flipped ? 'Flip board (Black side)' : 'Flip board';
  const turn = chess.turn() === 'w' ? 'White to move' : 'Black to move';
  const check = chess.inCheck();
  $('turn').textContent = check ? `${turn} (in check)` : turn;
  $('turn').classList.toggle('check', check);
  $('fen').textContent = chess.fen();

  const hasMoves = state.moves.length > 0;
  $('nav').classList.toggle('on', hasMoves);
  $('slider').max = String(state.moves.length);
  $('slider').value = String(state.ply);
  $('plyLabel').textContent = hasMoves ? `${state.ply} / ${state.moves.length}` : '';
  const movesEl = $('moves');
  movesEl.replaceChildren();
  state.moves.forEach((m, i) => {
    if (i % 2 === 0) movesEl.append(el('span', { class: 'num', text: `${i / 2 + 1}.` }));
    movesEl.append(el('button', { type: 'button', class: i + 1 === state.ply ? 'cur' : '', text: m.san, onclick: () => goTo(i + 1) }));
  });

  const container = $('view');
  container.replaceChildren();
  VIEWS[state.tab].render(container, board, { chess, turn: chess.turn(), fen: chess.fen() });
  if (state.showMoves) {
    const p = chess.get(state.showMoves);
    const n = legalMovesFor(chess, state.showMoves).length;
    const who = p ? `${p.color === 'w' ? 'White' : 'Black'} ${PIECE_WORDS[p.type]} on ${state.showMoves}` : state.showMoves;
    container.prepend(el('p', { class: 'mvhint', text: `${who}: ${n} legal move${n === 1 ? '' : 's'}${p && p.color !== chess.turn() ? ' (if it were their turn)' : ''}. Right-click again or press Esc to hide.` }));
  } else if (!container.querySelector('.mvhint')) {
    container.prepend(el('p', { class: 'mvhint', text: 'Right-click a piece to see where it can go.' }));
  }
}

function goTo(ply) {
  state.ply = Math.max(0, Math.min(state.moves.length, ply));
  writeHash();
  render();
}

// ---------- wiring ----------
const flipBoard = () => { state.flipped = !state.flipped; writeHash(); render(); };
$('flip').addEventListener('click', flipBoard);
$('letters').addEventListener('change', (e) => {
  state.pieceStyle = e.target.checked ? 'letters' : 'images';
  try { localStorage.setItem('pieceStyle', state.pieceStyle); } catch {}
  render();
});
$('load').addEventListener('click', () => load($('input').value));
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) load($('input').value); });
$('first').addEventListener('click', () => goTo(0));
$('prev').addEventListener('click', () => goTo(state.ply - 1));
$('next').addEventListener('click', () => goTo(state.ply + 1));
$('last').addEventListener('click', () => goTo(state.moves.length));
$('slider').addEventListener('input', (e) => goTo(Number(e.target.value)));
document.addEventListener('keydown', (e) => {
  if (e.target.matches('textarea, input')) return;
  if (e.key === 'ArrowLeft') goTo(state.ply - 1);
  if (e.key === 'ArrowRight') goTo(state.ply + 1);
  if (e.key === 'f' || e.key === 'F') flipBoard();
  if (e.key === 'Escape' && state.showMoves) { state.showMoves = null; render(); }
});

try {
  const initial = readHash();
  setPosition(initial || { kind: 'fen', fen: A.START_FEN });
  if (initial) $('input').value = initial.kind === 'fen' ? initial.fen : initial.pgn;
  render();
} catch (e) {
  setPosition({ kind: 'fen', fen: A.START_FEN });
  render();
  $('error').textContent = 'The position in the link could not be read; showing the start position.';
}
window.addEventListener('beforeprint', () => buildPrintSheet(currentChess().board()));
window.__viewer = { state, render, VIEWS, A, buildPrintSheet };
</script>
</body>
</html>
